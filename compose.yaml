# Runs the whole system locally: docker compose up --build
# then open http://localhost:3000. See README.md for the first-run steps.

name: laundry

x-api-env: &api-env
  APP_KEY: ${APP_KEY:?Set APP_KEY in .env (see README.md)}
  APP_URL: http://localhost:3000
  APP_LOCALE: fa
  APP_FALLBACK_LOCALE: en
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: laundry
  DB_USERNAME: laundry
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  REDIS_HOST: redis
  SESSION_DRIVER: redis
  SESSION_LIFETIME: "720"
  SESSION_COOKIE: laundry_session
  SESSION_SECURE_COOKIE: "false"
  SANCTUM_STATEFUL_DOMAINS: localhost:3000,127.0.0.1:3000
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  MAIL_MAILER: log
  # Customer text messages: log (written to the API log) or kavenegar.
  SMS_DRIVER: ${SMS_DRIVER:-log}
  KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
  KAVENEGAR_SENDER: ${KAVENEGAR_SENDER:-}
  # Live production boards through the Reverb socket server below.
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: laundry
  REVERB_APP_KEY: ${REVERB_APP_KEY:-laundry-key}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:-change-me}
  REVERB_HOST: reverb
  REVERB_PORT: "8080"
  REVERB_SCHEME: http
  # Browsers connect to the socket on the same host name as the panel.
  REVERB_PUBLIC_PORT: "8080"
  REVERB_PUBLIC_SCHEME: http

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: laundry
      POSTGRES_USER: laundry
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laundry -d laundry"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    build: ./backend
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
    environment: *api-env
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  # Runs scheduled jobs (overdue alerts on the production boards).
  scheduler:
    build: ./backend
    command: ["php", "artisan", "schedule:work"]
    environment: *api-env
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  # WebSocket server for live production boards.
  reverb:
    build: ./backend
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment: *api-env
    ports:
      - "8080:8080"
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://api:8000
    environment:
      SESSION_COOKIE: laundry_session
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres:
  redis:
