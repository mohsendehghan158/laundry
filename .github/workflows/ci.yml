name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: "8.4"
  NODE_VERSION: "22"
  PHP_EXTENSIONS: pdo_pgsql, redis, intl, bcmath

jobs:
  backend:
    name: Backend (lint, static analysis, tests, API contract)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: laundry
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: laundry_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U laundry" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - name: Code style (Pint)
        run: vendor/bin/pint --test
      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Tests (Pest)
        run: vendor/bin/pest --compact
        env:
          DB_HOST: 127.0.0.1
          DB_USERNAME: laundry
          DB_PASSWORD: secret
      - name: OpenAPI document is up to date
        # Scramble reads column types from the database, so it needs the schema.
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: laundry_test
          DB_USERNAME: laundry
          DB_PASSWORD: secret
        run: |
          php artisan migrate:fresh --force
          php artisan scramble:export
          git diff --exit-code -- ../docs/api/openapi.json || {
            echo "::error::docs/api/openapi.json is out of date. Run 'php artisan scramble:export' in backend/ and commit it."
            exit 1
          }

  frontend:
    name: Frontend (types, lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: API types match the OpenAPI document
        run: |
          npm run api:types
          git diff --exit-code -- src/shared/api/schema.d.ts || {
            echo "::error::src/shared/api/schema.d.ts is out of date. Run 'npm run api:types' in frontend/ and commit it."
            exit 1
          }
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: laundry
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: laundry_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U laundry" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: laundry
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env && php artisan key:generate
      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run build
        env:
          BACKEND_URL: http://127.0.0.1:8000
      - name: Run Playwright
        working-directory: frontend
        run: npx playwright test --trace off
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: Docker images build
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          build-args: BACKEND_URL=http://api:8000
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
